<style>
#wp{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;
    border:1px solid var(--border-300,#e5e3dd);border-radius:12px;overflow:hidden;
    background:var(--bg-100,#fff);color:var(--text-100,#1a1a18);max-width:720px;}
#wp .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:12px 14px;border-bottom:1px solid var(--border-300,#e5e3dd);
    background:var(--bg-200,#faf9f7);font-size:13px;}
#wp .cnt{font-variant-numeric:tabular-nums;color:var(--text-300,#6b6b66);white-space:nowrap;}
#wp .body{max-height:420px;overflow-y:auto;padding:6px 10px;}
#wp .ln{padding:5px 0;border-bottom:1px solid var(--border-200,#f0eeea);}
#wp .ln:last-child{border-bottom:0;}
#wp .chips{display:flex;flex-wrap:wrap;gap:4px;}
#wp .w{font:inherit;cursor:pointer;padding:3px 8px;border-radius:6px;
    border:1px solid transparent;background:transparent;color:var(--text-200,#3d3d3a);}
#wp .w:hover{background:var(--bg-300,#f0eeea);}
#wp .w.on{background:#FAE38E;color:#1a1a18;font-style:italic;font-weight:600;
    border-color:#e4c65e;font-family:Georgia,'Times New Roman',serif;}
#wp .ft{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;
    border-top:1px solid var(--border-300,#e5e3dd);background:var(--bg-200,#faf9f7);}
#wp .ft button{font:inherit;cursor:pointer;padding:7px 14px;border-radius:8px;
    border:1px solid var(--border-300,#e5e3dd);background:var(--bg-100,#fff);color:inherit;}
#wp #send{background:#1a1a18;color:#fff;border-color:#1a1a18;font-weight:600;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
<script>
(function(){
  const root=document.getElementById('wp');
  const count=()=>root.querySelectorAll('.w.on').length;
  const paint=()=>{document.getElementById('n').textContent=count();};
  root.querySelectorAll('.w').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('on');paint();}));
  document.getElementById('clr').addEventListener('click',()=>{
    root.querySelectorAll('.w.on').forEach(b=>b.classList.remove('on'));paint();});
  document.getElementById('send').addEventListener('click',()=>{
    const picks=[...root.querySelectorAll('.w.on')].map(b=>b.dataset.t+' '+b.dataset.w);
    sendPrompt(picks.length
      ? 'Accent these walkthrough words (time word):\n'+picks.join('\n')
      : 'No accents in the walkthrough section - remove all of them.');
  });
  paint();
})();
</script>
